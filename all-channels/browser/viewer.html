<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sal’s browser</title><style>
*{box-sizing:border-box}body{margin:0;background:#101720;color:#eef3fb;font:15px system-ui;display:flex;flex-direction:column;height:100dvh}header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;color:#17202a;flex-wrap:wrap}strong{font-size:17px}#status{flex:1;color:#5b6574}button{border:1px solid #dce2eb;border-radius:10px;padding:10px 16px;font:600 14px system-ui;cursor:pointer;background:white;color:#17202a}#take{background:#2668ff;border-color:#2668ff;color:white}button:disabled{opacity:.5;cursor:wait}#screen{flex:1;min-height:0;overflow:hidden}#hint{margin:0;padding:8px 16px;background:#192431;color:#ccd7e8;font-size:12px}#paste{width:180px;border:1px solid #dce2eb;border-radius:8px;padding:10px;font:14px system-ui}
#display{font:600 14px system-ui;padding:10px;border:1px solid #dce2eb;border-radius:10px;background:white;color:#17202a}@media(max-width:600px){header{gap:8px;padding:8px 10px}header>strong{display:none}#status{flex-basis:100%;font-size:12px}button,#display{padding:9px 10px}#paste{flex:1;min-width:80px;width:100px;font-size:16px}#hint{padding:6px 10px;font-size:11px}}
</style></head><body><header><strong>Sal’s browser</strong><span id="status">Connecting…</span><button id="take">Take control</button><button id="release">Return to Sal</button><select id="display" aria-label="Website format"><option value="mobile">Mobile site</option><option value="desktop" selected>Desktop site</option></select><input id="paste" aria-label="Paste text into browser" placeholder="Paste text…" autocomplete="off"><button id="paste-button">Paste</button></header><p id="hint">Watch Sal work, or take control to browse and sign in. Sal cannot inspect the browser while you have control.</p><div id="screen"></div>
<script type="module" nonce="__NONCE__">
import RFB from '/browser/vendor/core/rfb.js';
const params=new URLSearchParams(location.hash.slice(1)),mobile=params.get('mobile')==='1',ticket=params.get('ticket');history.replaceState(null,'',location.pathname);
const status=document.querySelector('#status'),take=document.querySelector('#take'),release=document.querySelector('#release'),paste=document.querySelector('#paste'),pasteButton=document.querySelector('#paste-button');const display=document.querySelector('#display');let rfb,connected=false,displayBusy=false;
async function request(action,extra={}){const response=await fetch('/browser/control',{method:'POST',headers:{Authorization:'Bearer '+ticket,'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});const body=await response.json();if(!response.ok)throw Error(body.error||'Session expired. Reconnect from Hawk.');return body;}
function apply(state){display.value=state.display||'desktop';display.disabled=displayBusy||state.mode==='handoff';const human=state.mode==='human'&&state.controller;rfb.viewOnly=!human;take.disabled=state.mode==='handoff';release.disabled=state.mode==='agent'||state.mode==='handoff';paste.disabled=pasteButton.disabled=!human;status.textContent=state.mode==='agent'?'Sal has control':state.mode==='handoff'?'Pausing Sal…':human?'You have control · Sal is paused':'Sal is paused · Take control to continue';}
async function refresh(){try{apply(await request('status'));}catch(error){status.textContent=error.message;take.disabled=release.disabled=display.disabled=true;rfb?.disconnect();}}
if(!ticket){status.textContent='Open a fresh browser session from Hawk.';take.disabled=release.disabled=display.disabled=true;}
else{
 const url=new URL('/browser/stream',location.href);url.protocol=location.protocol==='https:'?'wss:':'ws:';
 rfb=new RFB(document.querySelector('#screen'),url.href,{wsProtocols:['binary','sal-ticket.'+ticket]});rfb.scaleViewport=true;rfb.resizeSession=false;rfb.viewOnly=true;
 rfb.addEventListener('connect',async()=>{connected=true;if(mobile){try{displayBusy=true;display.disabled=true;apply(await request('display',{display:'mobile'}));document.querySelector('#hint').textContent='Mobile site requested for your shared browser. Existing pages may need a reload. Take control to browse; Sal stays paused until you Return to Sal.';}catch(error){status.textContent=error.message;}finally{displayBusy=false;display.disabled=false;}}else refresh();});rfb.addEventListener('disconnect',()=>{connected=false;status.textContent='Stream disconnected. Reconnect from Hawk. Sal stays paused if you had control.';take.disabled=release.disabled=display.disabled=true;});
 display.onchange=async()=>{displayBusy=true;display.disabled=true;try{apply(await request('display',{display:display.value}));document.querySelector('#hint').textContent='Site format updated for this shared browser. Reload the page if it still shows its previous layout.';}catch(error){status.textContent=error.message;}finally{displayBusy=false;display.disabled=false;}};
 take.onclick=async()=>{take.disabled=true;status.textContent='Pausing Sal…';try{apply(await request('take'));rfb.focus();}catch(error){status.textContent=error.message;take.disabled=false;}};
 release.onclick=async()=>{release.disabled=true;rfb.viewOnly=true;paste.value='';try{apply(await request('release'));}catch(error){status.textContent=error.message;}};
 pasteButton.onclick=()=>{rfb.clipboardPasteFrom(paste.value);rfb.sendKey(0xffe3,true);rfb.sendKey(0x76,true);rfb.sendKey(0x76,false);rfb.sendKey(0xffe3,false);paste.value='';rfb.focus();};
 setInterval(()=>{if(connected)refresh();},5000);
}
</script></body></html>
