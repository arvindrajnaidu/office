name: Publish Buzzie (all-channels) Docker image

on:
  push:
    branches: [main]
    tags: ["buzzie-v*"]
    paths:
      - "all-channels/**"
      - "whatsapp/**"
      - "telegram/**"
      - "email/**"
      - "voice/**"
      - "core/**"
      - "package.json"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/buzzie

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=buzzie-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: all-channels/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify persistent browser and live stream
        env:
          BROWSER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker volume create sal-browser-test
          docker run -d --name sal-browser-test -e SAL_BROWSER_ENABLED=1 -e BUZZIE_API_TOKEN=browser-ci-test-only -e BACKEND_URL=https://hawk.business/api/channel/chat/browser-test -v sal-browser-test:/data/browser "$BROWSER_IMAGE"
          docker exec sal-browser-test node all-channels/browser/smoke.js
          docker stop -t 25 sal-browser-test
          docker rm sal-browser-test
          docker run -d --name sal-browser-test -e SAL_BROWSER_ENABLED=1 -e BUZZIE_API_TOKEN=browser-ci-test-only -e BACKEND_URL=https://hawk.business/api/channel/chat/browser-test -v sal-browser-test:/data/browser "$BROWSER_IMAGE"
          docker exec sal-browser-test node all-channels/browser/smoke.js --after-restart
          docker rm -f sal-browser-test
          docker volume rm sal-browser-test
